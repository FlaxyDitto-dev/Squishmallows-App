name: Build Unsigned iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Project Directory Structure
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          
          # Force create the web assets directory layout
          mkdir -p www
          touch www/index.html
          
          # Move whatever project files exist into our web workspace
          cp index.html www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true

          # Initialize a clean configuration file 
          npx cap init "Squishmallows" "com.flaxyditto.squishmallows" --web-dir=www
          npx cap add ios

      - name: Compile App Bundle Payload
        run: |
          npx cap sync ios
          cd ios/App
          
          # Compile to a generic iOS Device bundle layout bypassing identity parameters entirely
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build

      - name: Package Manual Unsigned IPA Archive
        run: |
          # 1. Establish an official internal deployment structure
          mkdir -p Payload
          
          # 2. Extract and copy the compiled workspace bundle directly into our archive target
          cp -r ios/App/build/Release-iphoneos/App.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/App.app Payload/
          
          # 3. Compress the folder structure directly into an .ipa bundle format
          zip -r Squishmallows.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: squishmallows-ipa
          path: Squishmallows.ipa
