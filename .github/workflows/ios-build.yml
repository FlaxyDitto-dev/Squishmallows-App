name: Build Unsigned iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Project Directory Structure
        run: |
          # 1. Create a safe, tracking-isolated package base
          npm init -y
          npm install @capacitor/core @capacitor/cli

          # 2. Build a dedicated web target directory
          mkdir -p www
          
          # 3. Safely copy your HTML/CSS/JS files into the target folder if they exist in root
          cp index.html www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true

          # 4. Initialize Capacitor explicitly targeting the safe 'www' folder
          npx cap init "Squishmallows" "com.flaxyditto.squishmallows" --web-dir=www --id="com.flaxyditto.squishmallows"

          # 5. Inject the native iOS platform container
          npx cap add ios

      - name: Build Xcode Project
        run: |
          npx cap sync ios
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package Payload into IPA
        run: |
          mkdir -p ios/App/build/Release-iphoneos/Payload
          cp -r ios/App/build/Release-iphoneos/App.app ios/App/build/Release-iphoneos/Payload/
          cd ios/App/build/Release-iphoneos
          zip -r ../../../Squishmallows.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: squishmallows-ipa
          path: Squishmallows.ipa
